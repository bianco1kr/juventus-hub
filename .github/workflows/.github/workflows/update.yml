# Lägg filen i repot som .github/workflows/update.yml
name: Uppdatera Juventus-data

on:
  schedule:
    - cron: "0 5 * * *"      # varje dag 05:00 UTC
  workflow_dispatch:          # gör att du kan köra manuellt via Actions-fliken

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hämta matchdata
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python fetch_data.py
      - name: Hämta xG-data
        run: python fetch_xg.py
      - name: Spara om något ändrats
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          [ -f xg.json ] && git add xg.json || true
          git diff --staged --quiet || (git commit -m "Uppdatera data" && git push)
